# MW5 Motion configuration. Copy to the UEVR profile folder:
#   %APPDATA%\UnrealVRMod\MechWarrior-Win64-Shipping\mw5_motion.cfg
# Every line is optional; the values shown are the defaults.
# Changes take effect the next time the game starts.
Enable = 1

# SimHub "MechWarrior 5 Mercenaries (UEVR)" game. The port must match SimHub's.
SimHubEnable = 1
SimHubIp = 127.0.0.1
SimHubPort = 20779
SimHubRateHz = 120

# --- Motion ---------------------------------------------------------------
# Any key in this section can also be set for one chassis only; see the
# example at the end of the file.

# The cockpit mount point faces sideways relative to the mech. This turns the
# measured frame so that forward is the direction the torso faces.
CockpitYawOffsetDeg = -90

# Smoothing cutoffs in Hz. Lower = smoother and slower to react, 0 = off.
# Angles are never smoothed. The 2 Hz defaults approximate SpaceMonkey's UEVR filter.
PositionSmoothingHz = 2
VelocitySmoothingHz = 2
AccelerationSmoothingHz = 2
AngularSmoothingHz = 2

# Running bounce. Fast mechs with a tall stride bounce the cockpit far harder than
# others. HeaveComfortG is the most running bounce any mech may send, as a peak
# in G. From each chassis's walk and run animation and the mech's current ground
# speed the plugin works out how hard the bounce is, and scales the vertical
# force so it never exceeds this. Below the speed where a mech reaches the level
# its bounce is untouched; slow, gentle mechs are never changed. Jumps and
# landings are not capped. 0 = off.
HeaveComfortG = 3

# Backstop for what the plugin cannot predict (a chassis it has no data for, a
# limping mech): a slow limiter that eases the vertical force down while it
# stays above 1.25 times the comfort level. 0 = off.
HeaveSafetyNet = 1

# HeaveGain scales the vertical force as a whole (1 = as the game moves the
# cockpit, 0.5 = half). HeaveLimitG is a soft ceiling in G for everything else,
# such as jump lift-off and landings: peaks are squeezed and never exceed it.
# Keep it well above HeaveComfortG. 0 = no ceiling.
HeaveGain = 1
HeaveLimitG = 6

# Bounce data is built in for every stock chassis. For a chassis that is not
# covered (a modded mech), GaitLearning = 1 lets the plugin measure its bounce
# while you drive and save it to mw5_mech_gait.csv in this folder, where rows can
# also be added or corrected by hand. Leave it at 0 otherwise.
GaitLearning = 0

# Advanced: how far the cockpit travels as a share of the pelvis travel in the
# animation. Measured in game at about 0.75.
CockpitBounceRatio = 0.75

# Safety limits.
MaxAccelerationG = 10
MaxAngularSpeedDeg = 720
TeleportDistanceM = 10
MaxDeltaSeconds = 0.1

# Flip a channel by setting its sign to -1.
RollSign = 1
PitchSign = 1
YawSign = 1
LateralSign = 1
VerticalSign = 1
LongitudinalSign = 1

# Minimum time MascStarted, MascEnded, JumpStarted and JumpEnded stay set. 0 = one sample.
EventHoldMs = 100

# --- SimHub effects -------------------------------------------------------
# Gear Change: gear 1 -> 2 when MASC or a supercharger engages, 2 -> 1 when it stops.
HapticGearEnable = 1

# Engine Vibrations: jump jets report JumpJetLevel (0-1) of EngineMaxRpm while
# firing and JumpJetWarmupLevel during the short warm-up. 0 RPM otherwise.
HapticEngineEnable = 1
EngineMaxRpm = 10000
JumpJetLevel = 0.8
JumpJetWarmupLevel = 0.4

# MASC running is an engine vibration too. On a platform, high RPM is a fast,
# smooth buzz and low RPM is slow, rough shaking. So MASC starts at
# MascVibrationStartLevel (empty gauge) and falls to MascVibrationDamageLevel at
# the damage point: rougher the closer it gets to damage. Jump jets replace it
# while they run.
MascVibrationEnable = 1
MascVibrationStartLevel = 0.9
MascVibrationDamageLevel = 0.5

# MASC warning on SimHub's ABS effect, while MASC is on: silent below the game's
# warning point, then short taps at MinHz, rising to MaxHz at the damage point and
# staying there. Each tap is one ABS pulse; it is never held on. Start with the
# ABS effect low in SimHub. 0 = no warning taps.
MascWarningAbsEnable = 1
MascWarningAbsMinHz = 2
MascWarningAbsMaxHz = 6

# --- SimHub vehicle name (selects the motion profile) ----------------------
# Mechs are reported as "MW5 Slow", "MW5 Standard", "MW5 Fast" or "MW5 Very Fast"
# by top speed without MASC. The three numbers are the upper limits, in km/h, of
# Slow, Standard and Fast.
SpeedBandLimitsKmh = 60, 75, 100
# Chassis listed here are reported under their own name instead, for example
# "MW5 Dragon". Use the game's chassis id (see "chassis" in the status file).
# Example: SpecificChassis = Dragon, Locust
SpecificChassis =

# --- Debugging --------------------------------------------------------------
# Recording, written to the UEVR profile folder and restarted at each game start:
#   mw5_motion_debug.csv  samples, DebugLogRateHz rows per second (stops at 50 MB)
#   mw5_motion_debug.log  events: mech found, vehicle name, MASC and jump jet changes
DebugLog = 0
DebugLogRateHz = 20

# Optional JSON copy of every frame over UDP, for tools.
DebugJsonEnable = 0
DebugJsonIp = 127.0.0.1
DebugJsonPort = 20780
DebugJsonRateHz = 60

# --- Per-chassis overrides ---------------------------------------------------
# A [Chassis] block overrides motion keys for that chassis only. It must come
# after all general settings. The name is the game's chassis id, not the variant.
# None are set by default. Example, without the leading "# ":
# [Phoenixhawk]
# HeaveComfortG = 2.5
