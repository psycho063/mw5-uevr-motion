# MW5 Motion configuration. Copy this file to the UEVR profile folder:
#   %APPDATA%\UnrealVRMod\MechWarrior-Win64-Shipping\mw5_motion.cfg
# Every line is optional, and the values shown are the defaults.
# Restart the game to apply a change. 1 switches an option on, and 0 switches it off.
# Motion platforms can injure people. Change one value at a time, in small steps.
Enable = 1

# --- SimHub connection ------------------------------------------------------
# The port must match the port that is set in SimHub.
SimHubEnable = 1
SimHubIp = 127.0.0.1
SimHubPort = 20779
# A higher rate sends more packets per second, which gives smoother motion.
SimHubRateHz = 120

# --- Motion -----------------------------------------------------------------
# Every key in this section can also be set for one chassis at the end of the file.

# This angle turns the measured frame so that forward matches the torso direction.
# Change it only when forward motion appears as sideways motion.
CockpitYawOffsetDeg = -90

# Higher values make the motion react faster but pass on more jitter.
# Lower values make the motion smoother but slower. 0 switches a filter off.
PositionSmoothingHz = 2
VelocitySmoothingHz = 2
AccelerationSmoothingHz = 2
AngularSmoothingHz = 2

# This is the strongest running bounce that any mech may send, as a peak in G.
# A higher value allows a stronger bounce at high speed.
# A lower value makes running softer, and the cap starts at a lower speed.
# Jumps and landings are not capped. 0 switches the cap off.
HeaveComfortG = 2.5

# The safety net slowly reduces a bounce that stays above 1.25 times the comfort level.
# It covers mechs without bounce data and limping mechs.
HeaveSafetyNet = 1

# A higher gain makes all vertical motion stronger, and a lower gain makes it weaker.
# 1 is the motion of the game, and 0.5 is half of it.
HeaveGain = 1

# This is the ceiling in G for jumps, landings and other vertical peaks.
# A higher value allows harder peaks, and a lower value makes them softer.
# Keep it well above HeaveComfortG. 0 removes the ceiling.
HeaveLimitG = 6

# 1 measures the bounce of a mech that has no built-in data, such as a modded mech.
# The result is saved to mw5_mech_gait.csv in the profile folder.
GaitLearning = 0

# This is the cockpit travel as a share of the pelvis travel in the animation.
# A higher value makes the cap reduce running more, and a lower value reduces it less.
CockpitBounceRatio = 0.75

# These limits remove spikes. Higher values let stronger spikes reach the platform.
# Lower values cut off more of the real motion.
MaxAccelerationG = 10
MaxAngularSpeedDeg = 720
# The motion restarts from zero when the mech moves further than this in one frame.
TeleportDistanceM = 10
# The motion restarts from zero when one frame takes longer than this.
MaxDeltaSeconds = 0.1

# Set a sign to -1 when that channel moves the platform in the wrong direction.
RollSign = 1
PitchSign = 1
YawSign = 1
LateralSign = 1
VerticalSign = 1
LongitudinalSign = 1

# The MASC and jump start and end flags stay set for this many milliseconds.
# A higher value helps slow dashboards to catch the flags.
EventHoldMs = 100

# --- SimHub effects ---------------------------------------------------------
# The Gear Change effect fires when MASC or a supercharger switches on or off.
HapticGearEnable = 1

# The Engine Vibrations effect plays for jump jets, MASC and power changes.
# A level is a share of EngineMaxRpm, from 0 to 1.
# A higher level gives a faster and smoother vibration.
# A lower level gives a slower and rougher vibration.
HapticEngineEnable = 1
EngineMaxRpm = 10000

# Jump jets use the first level while they fire and the second during warm-up.
JumpJetLevel = 0.8
JumpJetWarmupLevel = 0.4

# MASC starts at the first level and falls to the second as the gauge fills.
# A lower second level makes the vibration rougher near the damage point.
MascVibrationEnable = 1
MascVibrationStartLevel = 0.9
MascVibrationDamageLevel = 0.5

# The ABS effect taps as a MASC warning, from the warning point of the game.
# The taps start at MinHz and rise to MaxHz at the damage point.
# Higher values give faster taps, and lower values give slower taps.
MascWarningAbsEnable = 1
MascWarningAbsMinHz = 2
MascWarningAbsMaxHz = 6

# Power-up and shutdown play a vibration that moves from a start level to an end level.
# Longer times in seconds stretch the vibration, and shorter times compress it.
# PowerInitSeconds applies to the start-up at the beginning of a mission.
# These effects need MechWarriorVR with the MechShakerRelay mod.
PowerVibrationEnable = 1
PowerUpStartLevel = 0.45
PowerUpEndLevel = 0.85
PowerDownStartLevel = 0.85
PowerDownEndLevel = 0.45
PowerInitSeconds = 5
PowerUpSeconds = 4
PowerDownSeconds = 3

# --- SimHub vehicle name ----------------------------------------------------
# SimHub selects a motion profile by vehicle name: MW5 Slow, Standard, Fast or Very Fast.
# The three numbers are the highest top speeds in km/h for Slow, Standard and Fast.
# Higher numbers move more mechs into the slower profiles.
SpeedBandLimitsKmh = 60, 75, 100

# A chassis that is listed here is sent under its own name, such as "MW5 Dragon".
# Use the chassis id from the status file. Example: SpecificChassis = Dragon, Locust
# You can use this option to send individual "vehicle" names to SimHub profiles for automatic profile switching
SpecificChassis =

# --- Debugging --------------------------------------------------------------
# 1 records each session to mw5_motion_debug.csv and mw5_motion_debug.log.
# Both files are written to the profile folder.
DebugLog = 0
# A higher rate writes more rows per second and fills the 50 MB limit sooner.
DebugLogRateHz = 20
# 1 also writes every MechShaker event to the log. It needs DebugLog = 1.
DebugShakerEvents = 0

# 1 sends every frame as JSON over UDP for live tools.
DebugJsonEnable = 0
DebugJsonIp = 127.0.0.1
DebugJsonPort = 20780
DebugJsonRateHz = 60

# --- Settings for one chassis -----------------------------------------------
# A [Chassis] block changes motion keys for that chassis only.
# It must come after all general settings and use the chassis id, not the variant.
# Remove the leading "# " from the two lines of this example to use it:
# [Phoenixhawk]
# HeaveComfortG = 2.5
